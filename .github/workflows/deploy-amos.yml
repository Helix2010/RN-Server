# 把服务端发到 amos。web4 那套（Docker + Caddy + compose）已经退役，见 ADR-0015。
#
# 与手工部署（deploy/amos/deploy.sh）的关系：两边最后都调用 amos 上的
# /usr/local/sbin/rn-foundation-apply，停服务、换二进制、跑迁移、健康检查、回滚
# 都在那一个脚本里，这里只负责"编译 + 送过去"。
#
# 权限：CI 用的是 amos 上的 rndeploy 账号，它全部的 sudo 权限就是那个脚本，脚本不以
# root 执行 CI 传来的二进制。别为了省事换成 ubuntu 账号，那是 NOPASSWD: ALL——等于把
# amos 的 root 交给 GitHub，而签名闸开发阶段也在这台机器上。
name: Validate and deploy RN-Server to amos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 三个 job 并行：build（决定要不要部署、不连库的测试、编安装包与二进制）、validate（要 MySQL 的
  # 库测与静态检查）、signing（签名闸 module，按用例分两片）。deploy 等三者都过。
  #
  # 2026-09-25 拆开之前，编译挂在 validate 末尾，理由是"能复用 validate 的缓存"——实测不成立：
  # 安装包的 -trimpath 与 darwin/arm64 交叉编译和 vet/test 的缓存条目不通用，一点都复用不上，
  # 于是 84 秒的冷编译整段压在关键路径上。推送到服务可用原先约 7.5 分钟（其中 CI 6 分 50 秒）。
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy-needed: ${{ steps.changes.outputs.deploy-needed }}
      agent-commit: ${{ steps.agent.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 要和上一个 main 比，才知道这一推动了什么
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # 统一登录客户端 github.com/Helix2010/authorization-go-sdk 是私有仓库：go 命令（包括下面 agent-commit.sh
      # 里的 go list）要用它的只读 deploy key 才拉得到
      - uses: ./.github/actions/private-go-modules
        with:
          deploy-key: ${{ secrets.AUTHORIZATION_SDK_DEPLOY_KEY }}

      # 只改文档的提交不该重新部署。安装包与打包机现在按 agent 提交出版本（下面「Work out the
      # agent commit」），只改文档或服务端都不会逼人重签；但服务端二进制每次部署都要停服务、跑迁移，
      # 纯文档的提交没必要走这一趟。那道离线签名是"服务端被攻破也换不出能过验的清单"的全部依据，
      # 别让人因为签得太勤而开始嫌它烦。
      #
      # 跳的只有 deploy。**validate 永远跑**：有测试是读文档的
      # （TestReleaseKeyTableMatchesTheDeployedKey 读 SIGNING_MATERIAL.md，
      # TestBundlesScriptPrintsTheMacInstallDigest 读 build-bundles.sh），
      # 纯文档改动照样可能让它们红，整个工作流跳过等于让这些守护失效。
      #
      # 判据是白名单取反：**只有确定不进安装包、也不进二进制的文档**才算"不用部署"。
      # 拿不准就部署——多部署一次只是多签一次，少部署一次是线上没跟上。
      - name: Decide whether this push needs a deploy
        id: changes
        run: |
          if [ "${{ github.event_name }}" != push ]; then
            echo "deploy-needed=true" >> "$GITHUB_OUTPUT"
            echo "手动触发：照常部署"
            exit 0
          fi
          before='${{ github.event.before }}'
          # 分支新建、force push 之后 before 可能不可用：拿不准就部署
          if [ -z "$before" ] || [ "$before" = 0000000000000000000000000000000000000000 ] ||
            ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "deploy-needed=true" >> "$GITHUB_OUTPUT"
            echo "取不到上一个 main，照常部署"
            exit 0
          fi
          changed="$(git diff --name-only "$before" "${{ github.sha }}")"
          echo "这一推动了："; printf '%s\n' "$changed" | sed 's/^/  /'
          # 白名单：确定只给人看的文档。deploy/signer/README.md 与
          # deploy/build-agent/README.md **会被打进安装包**，不在这里
          rest="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|[^/]+\.md$|deploy/DEPLOYMENT\.md$|deploy/build-agent-macos/(MAC_SETUP_RUNBOOK|SIGNING_MATERIAL)\.md$)' || true)"
          if [ -z "$rest" ]; then
            echo "deploy-needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=只改了文档::跳过部署，安装包与已有的清单签名保持不变。要强制部署就用 workflow_dispatch。"
          else
            echo "deploy-needed=true" >> "$GITHUB_OUTPUT"
            echo "有文档以外的改动，照常部署"
          fi
      # 不连库的包在这里跑。internal/api 与 internal/store 有库测，留在有 MySQL 的 validate：
      # 没有 RN_TEST_MYSQL_DSN 时库测一律 skip，而 skip 算通过——放到这里就是假绿
      - name: Packages without database tests, in parallel
        run: go test -race $(go list ./... | grep -vE '/internal/(api|store)$')
      # 不部署时也要确认 cmd/server 链接得起来；部署时下面编 amos 二进制已经覆盖了这一点
      - name: Link check
        if: steps.changes.outputs.deploy-needed != 'true' || vars.AMOS_DEPLOY_ENABLED != 'true'
        run: go build -o "$RUNNER_TEMP/server-link-check" ./cmd/server

      # 打包机程序的版本号：打包机构建输入最后一次变化的提交，不是 HEAD
      # （设计 docs/design/agent-version-from-build-inputs-2026-09-25.md）。只改服务端时它不变，
      # 安装包逐字节相同，已有的签名与批准继续有效，deploy 也会跳过安装包与 amos 的打包机
      - name: Work out the agent commit
        id: agent
        run: |
          commit="$(deploy/setup/agent-commit.sh)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ "$commit" = "$GITHUB_SHA" ]; then
            echo "::notice title=打包机版本::这一推改了打包机的构建输入，安装包换成 $commit，要离线签名并在控制台批准"
          else
            echo "::notice title=打包机版本::打包机的构建输入没变，仍是 $commit；只改了服务端，不用重签"
          fi

      # 归档可复现：这里打印的 sha256 就是运维装签名闸时 --expect-sha256 要核对的值。
      # build-bundles.sh 按 agent 提交算可复现归档、要求工作区干净，所以产物一律写在 RUNNER_TEMP。
      - name: Build machine bundles and the amos binaries
        if: steps.changes.outputs.deploy-needed == 'true' && vars.AMOS_DEPLOY_ENABLED == 'true'
        run: |
          deploy/setup/build-bundles.sh "$RUNNER_TEMP/machine-bundles"
          echo "::notice title=新机器安装包 sha256::$(cd "$RUNNER_TEMP/machine-bundles" && sha256sum signer.tar.gz builder.tar.gz builder-darwin-arm64.tar.gz | awk '{printf "%s %s; ", $2, $1}')"
          mkdir -p "$RUNNER_TEMP/amos"
          # 与 deploy/amos/deploy.sh 同一组参数。GOTOOLCHAIN=local：go.mod 固定了版本，
          # 不让它自己去下别的工具链
          GOTOOLCHAIN=local GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/amos/rn-server" ./cmd/server
          # -X main.commit：代理认领时自报的版本。**不打这个戳它就永远报空**，而版本闸的
          # 判据是"已批准 != 空 && 自报 != 已批准 → 409"——空同样算不相等。于是只要 amos
          # 上跑着一个没打戳的二进制，平台管理员就**永远不能用版本闸**。
          # 参数与 build-bundles.sh 里 linux 那份完全相同（含 -buildvcs=false，否则 Go 会把 HEAD
          # 写进二进制），所以它就是安装包里的 builder/bin/build-agent，下面核对这一点
          GOTOOLCHAIN=local GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -buildvcs=false -ldflags="-s -w -X main.commit=${{ steps.agent.outputs.commit }}" -o "$RUNNER_TEMP/amos/build-agent" ./cmd/build-agent
          want="$(jq -r '.bundles.builder.files[] | select(.name == "bin/build-agent") | .sha256' "$RUNNER_TEMP/machine-bundles/manifest.json")"
          got="$(sha256sum "$RUNNER_TEMP/amos/build-agent" | cut -d' ' -f1)"
          if [ "$want" != "$got" ]; then
            echo "::error::给 amos 编的 build-agent（$got）与安装包里的（$want）不是同一份字节：两处编译参数不一致"
            exit 1
          fi
          ls -l "$RUNNER_TEMP/amos"
      - name: Hand the payload to deploy
        if: steps.changes.outputs.deploy-needed == 'true' && vars.AMOS_DEPLOY_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-payload
          path: |
            ${{ runner.temp }}/machine-bundles
            ${{ runner.temp }}/amos
          retention-days: 1
          if-no-files-found: error

      # 部署被跳过时整个 run 仍然是绿的，没有任何地方说"其实没发出去"。真踩过：
      # 变量建成了 Secret，vars.* 取不到，validate 全绿，amos 上一次连接都没有
      - name: Warn when deployment is disabled
        if: vars.AMOS_DEPLOY_ENABLED != 'true'
        run: |
          echo "::warning title=没有部署::AMOS_DEPLOY_ENABLED 不是 'true'，deploy 会被跳过。它必须建在 Variables 标签页，不是 Secrets——vars.* 读不到 Secret。"

  validate:
    runs-on: ubuntu-latest
    # 数据库测试（TestDB*、迁移测试）没有 RN_TEST_MYSQL_DSN 时一律 skip，而 skip 在 go test 里
    # 算通过：签名闸的状态机、完成事务、迁移全在这一类里，不给库等于 CI 假绿。
    # 库是一次性的容器，口令只在这个 job 里有效，不是机密
    env:
      RN_TEST_MYSQL_DSN: root:rn-test@tcp(127.0.0.1:33061)/rn_test?parseTime=true&charset=utf8mb4
    steps:
      # 第一步就在后台起库，初始化（30–50 秒）与下面的 checkout、装 Go、vet 重叠。原先是服务容器：
      # Actions 要等它健康了才开始跑任何 step，而且服务容器传不了 mysqld 的启动参数。
      # 两个参数关掉每次提交的刷盘：一次性的测试库，掉电丢数据无所谓，库测会快不少
      - name: Start MySQL in the background
        run: |
          docker run -d --name rn-test-mysql -p 127.0.0.1:33061:3306 \
            -e MYSQL_ROOT_PASSWORD=rn-test -e MYSQL_DATABASE=rn_test \
            mysql:8.0 --innodb-flush-log-at-trx-commit=2 --sync-binlog=0
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/private-go-modules
        with:
          deploy-key: ${{ secrets.AUTHORIZATION_SDK_DEPLOY_KEY }}
      - run: test -z "$(gofmt -l cmd internal signing)"
      - run: go vet ./...
      # 这几个脚本以 root 跑在服务器上（install.sh 由服务端下发给新机器）：shellcheck 不过不发
      - name: shellcheck
        run: shellcheck internal/machinesetup/install.sh deploy/setup/build-bundles.sh deploy/setup/agent-commit.sh deploy/amos/rn-foundation-apply
      - run: jq empty contracts/openapi.json
      - name: Wait for MySQL
        # 镜像的初始化脚本先起一个不听 TCP 的临时实例、建完库再重启；真连上一次再跑测试，
        # 免得第一个包在连库上失败、被误读成代码问题
        env:
          MYSQL_PWD: rn-test
        run: |
          for i in $(seq 1 90); do
            if mysqladmin ping -h 127.0.0.1 -P 33061 -uroot --silent; then exit 0; fi
            sleep 2
          done
          docker logs --tail 50 rn-test-mysql
          echo "::error::MySQL 三分钟内没有就绪"
          exit 1
      # 两个有库测的包共用同一个库（迁移、build.machines 等平台级单行），并行跑会互相踩，
      # 所以分两步先后跑。两个包各自在首次连库时跑一遍迁移，先后顺序不再是约束。单个包不再加
      # -p 1：只有一个测试进程，-p 1 只会让编译也串行（2026-09-25 实测编译 31 秒 → 18 秒）
      - run: go test -race ./internal/api/
      - run: go test -race ./internal/store/

  # signing/ 是独立 module（签名闸与离线工具只依赖标准库），根目录的 ./... 不含它。
  #
  # internal/signer 一个包在 race 下要 160–190 秒（做的全是真的密码学运算，race 在这包上是 5 倍多），
  # 用例之间没有 t.Parallel。按用例名对半分到两个 runner 上跑，各自一个进程，不必为了并行去改测试里的
  # 共享状态；其余包和 vet 放在第 0 片。不需要 MySQL，也不需要 fetch-depth: 0。
  signing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          # 不写的话它和根 module 的 job 共用一个缓存键（都按根目录 go.sum 算），先跑完的一方
          # 抢先存下自己的缓存，另一方以后就一直是冷的
          cache-dependency-path: signing/go.sum
      - name: signing module (shard ${{ matrix.shard }} of 2)
        working-directory: signing
        run: |
          if [ "${{ matrix.shard }}" = 0 ]; then
            go vet ./...
            go test -race $(go list ./... | grep -v '/internal/signer$')
          fi
          mapfile -t all < <(go test -race -list '.' ./internal/signer | grep -E '^(Test|Fuzz|Example)')
          mine=()
          for i in "${!all[@]}"; do
            if [ $((i % 2)) = "${{ matrix.shard }}" ]; then mine+=("${all[$i]}"); fi
          done
          # 分片为空时 -run 什么都不跑、照样绿：宁可红
          if [ "${#all[@]}" -lt 10 ] || [ "${#mine[@]}" -eq 0 ]; then
            echo "::error::internal/signer 的用例清单不对（共 ${#all[@]} 个，本片 ${#mine[@]} 个）"
            exit 1
          fi
          echo "internal/signer：共 ${#all[@]} 个，本片 ${#mine[@]} 个"
          go test -race -run "^($(IFS='|'; echo "${mine[*]}"))\$" ./internal/signer

  deploy:
    needs: [build, validate, signing]
    if: vars.AMOS_DEPLOY_ENABLED == 'true' && needs.build.outputs.deploy-needed == 'true'
    # 串行的只有**真正动线上那台机器**的这一段：rn-foundation-apply 会停服务、换二进制、
    # 跑迁移，两次叠在一起就是在一台机器上同时做两次这件事。
    #
    # 原来这段写在工作流级别，于是 validate 也跟着排队——一天里连推十次，第十次要等前九次
    # 整个跑完（每次十几分钟）才开始编译，CI 看起来就"非常慢"，而其实是在排队。
    #
    # **不加 cancel-in-progress**：它和"只改文档就跳过部署"凑在一起会吃掉部署。先推一个代码
    # 提交、紧接着推一个改错别字的提交，后者会取消前者，而它自己又因为是纯文档而不部署——
    # 那个代码改动就永远上不了线，且没有任何地方报错。
    concurrency:
      group: amos-production-server
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    env:
      AMOS_HOST: ${{ secrets.AMOS_HOST }}
      AMOS_PORT: ${{ secrets.AMOS_PORT }}
      AMOS_USER: rndeploy
      STAGE: /var/lib/rn-foundation-deploy/incoming
    steps:
      # 仓库还是要的：下面要核对 amos 上那个特权脚本与本仓版本是否一致。但**不装 Go、
      # 不编译**——build 已经把安装包与两个二进制编好交过来了。
      # 扫链服务不单独编：它就是 rn-server 的 `indexer` 子命令，rn-foundation-apply
      # 换二进制时连它一起停、一起起。打包机是另一个二进制，同一个 commit 编出来，
      # 只有下面 AMOS_DEPLOY_BUILD_AGENT 开着才送上去
      - uses: actions/checkout@v4
      - name: Take the payload from build
        uses: actions/download-artifact@v4
        with:
          name: deploy-payload
          path: ${{ runner.temp }}
      - name: Put the binaries where the later steps expect them
        # upload-artifact 不保留可执行位，而下面是 `ssh amos "cat > …" < 文件`——
        # 只读文件内容，位不位其实无所谓；补上只是为了 ls 看着不吓人、也便于本地复跑
        run: |
          chmod +x "$RUNNER_TEMP/amos/rn-server" "$RUNNER_TEMP/amos/build-agent"
          mv "$RUNNER_TEMP/amos/rn-server" "$RUNNER_TEMP/amos/build-agent" .
          ls -l rn-server build-agent "$RUNNER_TEMP/machine-bundles"

      - name: Configure SSH
        env:
          AMOS_SSH_KEY: ${{ secrets.AMOS_SSH_KEY }}
          AMOS_KNOWN_HOSTS: ${{ secrets.AMOS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AMOS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$AMOS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # 非标准端口的 known_hosts 条目形如 [host]:port，查的时候也得带上端口
          cat >> ~/.ssh/config <<CONF
          Host amos
            HostName $AMOS_HOST
            Port ${AMOS_PORT:-22}
            User $AMOS_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking yes
            # 连接复用：这个 job 要连十几次，每次握手约 2 秒。第一次连上后留一个主连接，之后的
            # 每一条 ssh 都走它。账号、命令、sudo 边界都不变
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 10m
          CONF
          chmod 600 ~/.ssh/config

      - name: Validate SSH material
        run: |
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          host="$AMOS_HOST"
          [ "${AMOS_PORT:-22}" = "22" ] || host="[$AMOS_HOST]:$AMOS_PORT"
          if ! ssh-keygen -F "$host" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::AMOS_KNOWN_HOSTS 里没有 $host 的条目"
            exit 1
          fi

      - name: Verify SSH connection
        run: ssh amos 'printf "ssh-ready\n"'

      - name: Check the host helper matches this revision
        # 特权脚本不由 CI 自己更新——那等于把 root 交给 CI。仓库里改了它，就得有人
        # 在 amos 上重跑一次 deploy/amos/setup-ci-deploy.sh，这里只负责提醒
        run: |
          want=$(sha256sum deploy/amos/rn-foundation-apply | cut -d' ' -f1)
          got=$(ssh amos 'sha256sum /usr/local/sbin/rn-foundation-apply 2>/dev/null || true' | cut -d' ' -f1)
          if [ -z "$got" ]; then
            echo "::error::amos 上没装 rn-foundation-apply，先在那台机器上跑 deploy/amos/setup-ci-deploy.sh"
            exit 1
          fi
          [ "$want" = "$got" ] || echo "::warning::amos 上的 rn-foundation-apply 与本仓库版本不一致，考虑重跑 setup-ci-deploy.sh"

      # 安装包与 amos 的打包机按 agent 提交出版本：只改服务端时它们与 amos 上的逐字节相同，跳过传输与
      # apply（打包机不重启）。**守门**：版本号相同、字节却不同，说明 agent-commit.sh 的输入清单漏了东西
      # （或工具链变了）——不能让一份内容不同的程序顶着已批准的版本号上线。守门只挡安装包与打包机，
      # 服务端照常发布（「安装包出问题不挡服务端发布」），job 在最后一步失败
      - name: Compare with what amos already has
        id: compare
        env:
          AGENT_COMMIT: ${{ needs.build.outputs.agent-commit }}
        run: |
          manifest="$RUNNER_TEMP/machine-bundles/manifest.json"
          new_sha="$(sha256sum "$manifest" | cut -d' ' -f1)"
          [ "$(jq -r .commit "$manifest")" = "$AGENT_COMMIT" ] || { echo "::error::清单的 commit 不是 build 算出的 agent 提交"; exit 1; }
          current=/opt/rn-foundation/machine-bundles/current/manifest.json
          old_sha="$(ssh amos "sha256sum $current 2>/dev/null | cut -d' ' -f1")"
          old_commit="$(ssh amos "jq -r .commit $current 2>/dev/null || true")"
          if [ "$new_sha" = "$old_sha" ]; then
            echo "bundles-changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=安装包没变::amos 上已经是 $AGENT_COMMIT 的这一份，不传、不 apply，签名与批准照旧有效"
          elif [ "$old_commit" = "$AGENT_COMMIT" ]; then
            echo "bundles-changed=false" >> "$GITHUB_OUTPUT"
            echo "agent-changed=false" >> "$GITHUB_OUTPUT"
            echo "mismatch=amos 上 $AGENT_COMMIT 的清单是 $old_sha，这次构建出 $new_sha" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "bundles-changed=true" >> "$GITHUB_OUTPUT"
          fi
          new_agent="$(sha256sum build-agent | cut -d' ' -f1)"
          old_agent="$(ssh amos 'sha256sum /opt/rn-build-agent/build-agent 2>/dev/null | cut -d" " -f1')"
          if [ "$new_agent" = "$old_agent" ]; then
            echo "agent-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "agent-changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload binary
        # 先写 .part 再改名：传到一半断掉时暂存目录里不会留下一个像是完整的二进制
        run: |
          ssh amos "set -eu; mkdir -p '$STAGE'; cat > '$STAGE/rn-server.part'; mv '$STAGE/rn-server.part' '$STAGE/rn-server'" < rn-server

      - name: Apply
        # 停服务、换二进制、跑迁移、健康检查、失败回滚都在 amos 那个脚本里。
        # 扫链（rn-foundation-indexer）跟着这一步一起换——同一个二进制
        run: ssh amos 'sudo /usr/local/sbin/rn-foundation-apply server'

      # ---- 新机器安装包 ------------------------------------------------------
      #
      # 放在服务端之后：安装包出问题不挡服务端发布。rn-foundation-apply 只把三个文件拷成 root 的副本、
      # 核对、原子切换 /opt/rn-foundation/machine-bundles/current，不执行其中任何东西。
      # 已经在跑的签名闸与构建机不从这里升级。
      - name: Upload machine bundles
        if: steps.compare.outputs.bundles-changed == 'true'
        run: |
          if ! ssh amos 'grep -q "^bundles)" /usr/local/sbin/rn-foundation-apply'; then
            echo "::error::amos 上的 rn-foundation-apply 还不认 bundles 子命令：在那台机器上重跑 deploy/amos/setup-ci-deploy.sh 更新它"
            exit 1
          fi
          # 五个文件一个 tar 流送过去（原来一个文件一次 ssh）。apply 会把它们拷成 root 的副本、
          # 逐个核对是非空的普通文件、sha256 在清单里，这里只负责送到
          tar -C "$RUNNER_TEMP/machine-bundles" -cf - \
            manifest.json signer.tar.gz builder.tar.gz builder-darwin-arm64.tar.gz release-key.pub |
            ssh amos "set -eu
              rm -rf '$STAGE/machine-bundles.part'
              mkdir -p '$STAGE/machine-bundles.part'
              tar -C '$STAGE/machine-bundles.part' -xf -
              rm -rf '$STAGE/machine-bundles'
              mv '$STAGE/machine-bundles.part' '$STAGE/machine-bundles'"

      - name: Apply machine bundles
        if: steps.compare.outputs.bundles-changed == 'true'
        # apply 核对清单里的 commit 与这个参数相同：传的是 agent 提交，不是 GITHUB_SHA
        run: ssh amos "sudo /usr/local/sbin/rn-foundation-apply bundles ${{ needs.build.outputs.agent-commit }}"

      # ---- 打包机 ----------------------------------------------------------
      #
      # **签名闸与 amos 同机期间必须关着**（docs/design/android-signing-gate-2026-09-16.md
      # 「开发阶段的部署」「部署与运维」）。这一步换掉的是构建机控制进程，它以 rn-build-agent
      # 身份运行、持有机器令牌与出处密钥：开着它，能往 main 推代码或拿到 AMOS_SSH_KEY 的人，
      # 就能以受信构建机的名义给签名闸送包，并在签名闸所在的机器上执行任意代码。开关是仓库 Variables 里的 AMOS_DEPLOY_BUILD_AGENT，
      # 不建或不是 'true' 即关；关着时打包机手工部署，见 deploy/build-agent/README.md。
      - name: Upload the build agent
        if: vars.AMOS_DEPLOY_BUILD_AGENT == 'true' && steps.compare.outputs.agent-changed == 'true'
        run: |
          ssh amos "set -eu; cat > '$STAGE/build-agent.part'; mv '$STAGE/build-agent.part' '$STAGE/build-agent'" < build-agent

      - name: Apply the build agent
        if: vars.AMOS_DEPLOY_BUILD_AGENT == 'true' && steps.compare.outputs.agent-changed == 'true'
        # 放在服务端之后：代理起来第一件事是连服务端登记公钥。
        # 这一步不会阻塞等构建排空——代理手上有活时，新二进制就位、做完自动生效
        run: ssh amos 'sudo /usr/local/sbin/rn-foundation-apply build-agent'

      # 守门失败放在最后：服务端已经照常发布，安装包与打包机没动。恢复办法：把漏掉的输入补进
      # deploy/setup/agent-commit.sh（工具链变了的话，改 go.mod 本身就是输入变化）——那个提交改了脚本，
      # agent 提交随之前进，下一次部署出新版本，照常签名、批准
      - name: Refuse bundles that changed under the same version
        if: steps.compare.outputs.mismatch != ''
        env:
          MISMATCH: ${{ steps.compare.outputs.mismatch }}
        run: |
          echo "::error title=同一版本号、不同字节::$MISMATCH。服务端已发布，安装包与打包机没换。deploy/setup/agent-commit.sh 的输入清单漏了会影响安装包的文件（或工具链变了）：补上之后再推一次，版本号会前进"
          exit 1
