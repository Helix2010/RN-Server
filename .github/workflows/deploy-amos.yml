# 把服务端发到 amos。web4 那套（Docker + Caddy + compose）已经退役，见 ADR-0015。
#
# 与手工部署（deploy/amos/deploy.sh）的关系：两边最后都调用 amos 上的
# /usr/local/sbin/rn-foundation-apply，停服务、换二进制、跑迁移、健康检查、回滚
# 都在那一个脚本里，这里只负责"编译 + 送过去"。
#
# 权限：CI 用的是 amos 上的 rndeploy 账号，它全部的 sudo 权限就是那个脚本，脚本不以
# root 执行 CI 传来的二进制。别为了省事换成 ubuntu 账号，那是 NOPASSWD: ALL——等于把
# amos 的 root 交给 GitHub，而签名闸开发阶段也在这台机器上。
name: Validate and deploy RN-Server to amos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amos-production-server
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal signing)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/server
      # signing/ 是独立 module（签名闸与离线工具只依赖标准库），根目录的 ./... 不含它
      - name: signing module
        working-directory: signing
        run: |
          go vet ./...
          go test -race ./...
      - run: jq empty contracts/openapi.json

      # 部署被跳过时整个 run 仍然是绿的，没有任何地方说"其实没发出去"。真踩过：
      # 变量建成了 Secret，vars.* 取不到，validate 全绿，amos 上一次连接都没有
      - name: Warn when deployment is disabled
        if: vars.AMOS_DEPLOY_ENABLED != 'true'
        run: |
          echo "::warning title=没有部署::AMOS_DEPLOY_ENABLED 不是 'true'，deploy 会被跳过。它必须建在 Variables 标签页，不是 Secrets——vars.* 读不到 Secret。"

  deploy:
    needs: validate
    if: vars.AMOS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      AMOS_HOST: ${{ secrets.AMOS_HOST }}
      AMOS_PORT: ${{ secrets.AMOS_PORT }}
      AMOS_USER: rndeploy
      STAGE: /var/lib/rn-foundation-deploy/incoming
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile for amos
        # 与 deploy/amos/deploy.sh 同一组参数。GOTOOLCHAIN=local：go.mod 固定了版本，
        # 不让它自己去下别的工具链。
        #
        # 扫链服务不单独编：它就是这个二进制的 `rn-server indexer` 子命令，
        # rn-foundation-apply 里换二进制时会连它一起停、一起起。
        #
        # 打包机是另一个二进制，和服务端同一个 commit 编出来；只有下面
        # AMOS_DEPLOY_BUILD_AGENT 开着才会送上去
        run: |
          GOTOOLCHAIN=local GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o rn-server ./cmd/server
          GOTOOLCHAIN=local GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o build-agent ./cmd/build-agent
          ls -l rn-server build-agent

      - name: Configure SSH
        env:
          AMOS_SSH_KEY: ${{ secrets.AMOS_SSH_KEY }}
          AMOS_KNOWN_HOSTS: ${{ secrets.AMOS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AMOS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$AMOS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # 非标准端口的 known_hosts 条目形如 [host]:port，查的时候也得带上端口
          cat >> ~/.ssh/config <<CONF
          Host amos
            HostName $AMOS_HOST
            Port ${AMOS_PORT:-22}
            User $AMOS_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking yes
          CONF
          chmod 600 ~/.ssh/config

      - name: Validate SSH material
        run: |
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          host="$AMOS_HOST"
          [ "${AMOS_PORT:-22}" = "22" ] || host="[$AMOS_HOST]:$AMOS_PORT"
          if ! ssh-keygen -F "$host" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::AMOS_KNOWN_HOSTS 里没有 $host 的条目"
            exit 1
          fi

      - name: Verify SSH connection
        run: ssh amos 'printf "ssh-ready\n"'

      - name: Check the host helper matches this revision
        # 特权脚本不由 CI 自己更新——那等于把 root 交给 CI。仓库里改了它，就得有人
        # 在 amos 上重跑一次 deploy/amos/setup-ci-deploy.sh，这里只负责提醒
        run: |
          want=$(sha256sum deploy/amos/rn-foundation-apply | cut -d' ' -f1)
          got=$(ssh amos 'sha256sum /usr/local/sbin/rn-foundation-apply 2>/dev/null || true' | cut -d' ' -f1)
          if [ -z "$got" ]; then
            echo "::error::amos 上没装 rn-foundation-apply，先在那台机器上跑 deploy/amos/setup-ci-deploy.sh"
            exit 1
          fi
          [ "$want" = "$got" ] || echo "::warning::amos 上的 rn-foundation-apply 与本仓库版本不一致，考虑重跑 setup-ci-deploy.sh"

      - name: Upload binary
        run: |
          ssh amos "mkdir -p '$STAGE'"
          # 先写 .part 再改名：传到一半断掉时暂存目录里不会留下一个像是完整的二进制
          ssh amos "cat > '$STAGE/rn-server.part'" < rn-server
          ssh amos "mv '$STAGE/rn-server.part' '$STAGE/rn-server'"

      - name: Apply
        # 停服务、换二进制、跑迁移、健康检查、失败回滚都在 amos 那个脚本里。
        # 扫链（rn-foundation-indexer）跟着这一步一起换——同一个二进制
        run: ssh amos 'sudo /usr/local/sbin/rn-foundation-apply server'

      # ---- 打包机 ----------------------------------------------------------
      #
      # **签名闸与 amos 同机期间必须关着**（docs/design/android-signing-gate-2026-09-16.md
      # 「开发阶段的部署」「部署与运维」）。这一步换掉的是以 builder 身份运行的那个二进制：
      # 开着它，能往 main 推代码或拿到 AMOS_SSH_KEY 的人，就能以 builder 身份在签名闸
      # 所在的机器上执行任意代码。开关是仓库 Variables 里的 AMOS_DEPLOY_BUILD_AGENT，
      # 不建或不是 'true' 即关；关着时打包机手工部署，见 deploy/build-agent/README.md。
      - name: Upload the build agent
        if: vars.AMOS_DEPLOY_BUILD_AGENT == 'true'
        run: |
          ssh amos "cat > '$STAGE/build-agent.part'" < build-agent
          ssh amos "mv '$STAGE/build-agent.part' '$STAGE/build-agent'"

      - name: Apply the build agent
        if: vars.AMOS_DEPLOY_BUILD_AGENT == 'true'
        # 放在服务端之后：代理起来第一件事是连服务端登记公钥。
        # 这一步不会阻塞等构建排空——代理手上有活时，新二进制就位、做完自动生效
        run: ssh amos 'sudo /usr/local/sbin/rn-foundation-apply build-agent'
