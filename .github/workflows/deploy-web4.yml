name: Validate and deploy RN-Server to web4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web4-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/server
      - run: jq empty contracts/openapi.json

  deploy:
    needs: validate
    if: vars.WEB4_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: /home/ubuntu/fy/service
      WEB4_HOST: ${{ secrets.WEB4_HOST }}
      WEB4_USER: ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          WEB4_SSH_KEY: ${{ secrets.WEB4_SSH_KEY }}
          WEB4_KNOWN_HOSTS: ${{ secrets.WEB4_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$WEB4_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$WEB4_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Validate SSH material
        run: |
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          if ! ssh-keygen -F "$WEB4_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::WEB4_KNOWN_HOSTS does not contain WEB4_HOST"
            exit 1
          fi
      - name: Verify SSH connection
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$WEB4_USER@$WEB4_HOST" 'printf "ssh-ready\n"'
      - name: Upload isolated staging source
        run: |
          staging="$DEPLOY_PATH/.incoming-rn-server-$GITHUB_SHA"
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$WEB4_USER@$WEB4_HOST" "mkdir -p '$staging'"
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15" \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'bin/' \
            ./ "$WEB4_USER@$WEB4_HOST:$staging/"
      - name: Deploy with lock, health gate and rollback
        run: |
          staging="$DEPLOY_PATH/.incoming-rn-server-$GITHUB_SHA"
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$WEB4_USER@$WEB4_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' STAGING='$staging' bash -s" <<'REMOTE'
          set -eu
          [ "$DEPLOY_PATH" = "/home/ubuntu/fy/service" ]
          case "$STAGING" in
            "$DEPLOY_PATH"/.incoming-rn-server-*) ;;
            *) exit 2 ;;
          esac
          cd "$DEPLOY_PATH"
          test -f .env
          test -f compose.yaml
          test -d "$STAGING"
          exec 9>"$DEPLOY_PATH/.deploy.lock"
          flock -w 300 9
          backup="$DEPLOY_PATH/.rollback-rn-server-$(date +%s)"
          compose_backup="$DEPLOY_PATH/.rollback-compose-$(date +%s).yaml"
          gateway_preexisting=false
          if docker inspect rn-foundation-gateway >/dev/null 2>&1; then
            gateway_preexisting=true
          fi
          cp compose.yaml "$compose_backup"
          if [ -d rn-server ]; then mv rn-server "$backup"; fi
          mv "$STAGING" rn-server
          cp rn-server/deploy/web4/compose.yaml compose.yaml
          if docker compose --env-file .env -f compose.yaml up -d --build --no-deps server; then
            server_healthy=false
            for _ in $(seq 1 90); do
              if [ "$(docker inspect -f '{{.State.Health.Status}}' rn-foundation-server 2>/dev/null || true)" = healthy ]; then
                server_healthy=true
                break
              fi
              sleep 5
            done
            if [ "$server_healthy" = true ] && \
              docker compose --env-file .env -f compose.yaml up -d --build --no-deps gateway; then
              gateway_healthy=false
              for _ in $(seq 1 30); do
                if [ "$(docker inspect -f '{{.State.Health.Status}}' rn-foundation-gateway 2>/dev/null || true)" = healthy ]; then
                  gateway_healthy=true
                  break
                fi
                sleep 2
              done
            fi
            if [ "${gateway_healthy:-false}" = true ]; then
              if [ -d "$backup" ]; then rm -rf "$backup"; fi
              rm -f "$compose_backup"
              cp rn-server/deploy/web4/start.sh rn-server/deploy/web4/stop.sh \
                rn-server/deploy/web4/status.sh rn-server/deploy/web4/prepare-env.sh .
              chmod +x start.sh stop.sh status.sh prepare-env.sh
              exit 0
            fi
          fi
          failed="${STAGING/.incoming-rn-server-/.failed-rn-server-}"
          mv rn-server "$failed"
          if [ -d "$backup" ]; then
            mv "$backup" rn-server
            mv "$compose_backup" compose.yaml
            if [ "$gateway_preexisting" = true ]; then
              docker compose --env-file .env -f compose.yaml up -d --build --no-deps server gateway
            else
              docker compose --env-file .env -f compose.yaml up -d --build --no-deps server
              docker rm -f rn-foundation-gateway >/dev/null 2>&1 || true
            fi
          fi
          rm -rf "$failed"
          exit 1
          REMOTE
