name: rn-foundation

services:
  gateway:
    container_name: rn-foundation-gateway
    build:
      context: ./rn-server/deploy/web4
      dockerfile: Caddy.Dockerfile
    image: rn-foundation-gateway:2.10.2-cloudflare
    init: true
    restart: unless-stopped
    environment:
      PUBLIC_BASE_DOMAIN: ${PUBLIC_BASE_DOMAIN:-anyfun.win}
      PUBLIC_CONSOLE_DOMAIN: ${PUBLIC_CONSOLE_DOMAIN:-console.anyfun.win}
      PUBLIC_API_DOMAIN: ${PUBLIC_API_DOMAIN:-api.anyfun.win}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    depends_on:
      server:
        condition: service_healthy
      admin:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./rn-server/deploy/web4/Caddyfile:/etc/caddy/Caddyfile:ro
      - rn_caddy_data:/data
      - rn_caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  server:
    container_name: rn-foundation-server
    build:
      context: ./rn-server
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: 3000
      HTTP_READ_TIMEOUT_SECONDS: ${HTTP_READ_TIMEOUT_SECONDS:-3600}
      HTTP_WRITE_TIMEOUT_SECONDS: ${HTTP_WRITE_TIMEOUT_SECONDS:-3600}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ANDROID_STORE_URL: ${ANDROID_STORE_URL:-}
      ANDROID_DIRECT_URL: ${ANDROID_DIRECT_URL:-}
      IOS_STORE_URL: ${IOS_STORE_URL:-}
      IOS_MDM_URL: ${IOS_MDM_URL:-}
      OTA_CHANNEL: ${OTA_CHANNEL:-production}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_LOGIN_MAX_ATTEMPTS: ${ADMIN_LOGIN_MAX_ATTEMPTS:-5}
      ADMIN_LOGIN_WINDOW_SECONDS: ${ADMIN_LOGIN_WINDOW_SECONDS:-900}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT:-3}
      MYSQL_MAX_IDLE_CONNECTIONS: ${MYSQL_MAX_IDLE_CONNECTIONS:-1}
      MYSQL_CONNECTION_MAX_LIFETIME_SECONDS: ${MYSQL_CONNECTION_MAX_LIFETIME_SECONDS:-600}
      MYSQL_CONNECTION_MAX_IDLE_TIME_SECONDS: ${MYSQL_CONNECTION_MAX_IDLE_TIME_SECONDS:-60}
      MYSQL_QUERY_TIMEOUT_SECONDS: ${MYSQL_QUERY_TIMEOUT_SECONDS:-10}
      MYSQL_CHARSET: ${MYSQL_CHARSET:-utf8mb4}
      MYSQL_TIMEZONE: ${MYSQL_TIMEZONE:-Z}
      MYSQL_PARSE_TIME: ${MYSQL_PARSE_TIME:-true}
      MYSQL_CONNECT_TIMEOUT_SECONDS: ${MYSQL_CONNECT_TIMEOUT_SECONDS:-15}
      MYSQL_READ_TIMEOUT_SECONDS: ${MYSQL_READ_TIMEOUT_SECONDS:-15}
      MYSQL_WRITE_TIMEOUT_SECONDS: ${MYSQL_WRITE_TIMEOUT_SECONDS:-15}
      MYSQL_INIT_TIMEOUT_SECONDS: ${MYSQL_INIT_TIMEOUT_SECONDS:-30}
      MYSQL_INIT_MAX_ATTEMPTS: ${MYSQL_INIT_MAX_ATTEMPTS:-3}
      MYSQL_INIT_RETRY_DELAY_SECONDS: ${MYSQL_INIT_RETRY_DELAY_SECONDS:-5}
      MYSQL_AUTO_MIGRATE: ${MYSQL_AUTO_MIGRATE:-false}
      STORAGE_MASTER_KEY: ${STORAGE_MASTER_KEY}
      ARTIFACT_MAX_SIZE_MB: ${ARTIFACT_MAX_SIZE_MB:-512}
      ARTIFACT_UPLOAD_MODE: ${ARTIFACT_UPLOAD_MODE:-direct}
      ARTIFACT_UPLOAD_TTL_SECONDS: ${ARTIFACT_UPLOAD_TTL_SECONDS:-900}
      ARTIFACT_MULTIPART_TTL_SECONDS: ${ARTIFACT_MULTIPART_TTL_SECONDS:-7200}
      ARTIFACT_DOWNLOAD_TTL_SECONDS: ${ARTIFACT_DOWNLOAD_TTL_SECONDS:-300}
      ARTIFACT_VERIFY_TIMEOUT_SECONDS: ${ARTIFACT_VERIFY_TIMEOUT_SECONDS:-300}
      DEVICE_IDENTITY_HMAC_KEY: ${DEVICE_IDENTITY_HMAC_KEY:-}
      PUSH_DISPATCH_ENABLED: ${PUSH_DISPATCH_ENABLED:-false}
      PUSH_POLL_INTERVAL_SECONDS: ${PUSH_POLL_INTERVAL_SECONDS:-10}
      PUSH_CONCURRENCY: ${PUSH_CONCURRENCY:-8}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-production}
      HMS_APP_ID: ${HMS_APP_ID:-}
      HMS_CLIENT_ID: ${HMS_CLIENT_ID:-}
      HMS_CLIENT_SECRET: ${HMS_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${SERVER_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD", "./rn-server", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  admin:
    container_name: rn-foundation-admin
    build:
      context: ./rn-admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_SERVER_URL}
    init: true
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3180}:80"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

volumes:
  rn_caddy_data:
    name: rn-foundation-caddy-data
  rn_caddy_config:
    name: rn-foundation-caddy-config
