# /etc/nginx/conf.d/rn-foundation.conf —— **有证书时的形态**
#
# 由 setup-tls.sh 在证书签发成功之后装上，替换掉同目录的 nginx-rn-foundation.conf。
# 业务全部走 :443，:80 只剩两件事：ACME 续期校验，以及把其余请求跳到 https。
#
# 证书是 certbot 用 webroot 方式签的（--cert-name rn-foundation），续期由
# certbot.timer 自动做，续完的 deploy hook 会重载 nginx。这个文件 certbot 不碰。
#
# 两个租户四个域名。**租户是按 Host 头认的**（tenant_domain 表），所以反代必须
# 原样传 $host——写成 `Host 127.0.0.1:13080` 的话服务端一律回 TENANT_DOMAIN_NOT_FOUND。

# ---------- :80 只做校验与跳转 ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.any123.top api.predict.kim console.any123.top console.predict.kim;

    # 续期校验必须留在 :80：ACME 的 HTTP-01 只认 80 端口，跳到 443 它不跟
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ---------- API ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.any123.top api.predict.kim;

    ssl_certificate     /etc/letsencrypt/live/rn-foundation/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rn-foundation/privkey.pem;
    # certbot 装包时生成，含协议/套件选择与会话参数
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 一年期 HSTS。上了就别随便下：浏览器会记住，中途撤掉会让用户在缓存过期前
    # 一直只能走 https
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/rn-foundation.api.access.log;
    error_log  /var/log/nginx/rn-foundation.api.error.log;

    # 安装包直传走这条路径，512MB 的 APK 不能被 nginx 默认的 1m 卡掉。
    # 0 = 不限制，上限由服务端的 ARTIFACT_MAX_SIZE_MB 管
    client_max_body_size 0;
    # 大文件边收边转发，不先落盘再转
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:13080;

        # 租户识别靠它，不能改写
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
    }
}

# ---------- 控制台：any123 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.any123.top;

    ssl_certificate     /etc/letsencrypt/live/rn-foundation/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rn-foundation/privkey.pem;
    # certbot 装包时生成，含协议/套件选择与会话参数
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 一年期 HSTS。上了就别随便下：浏览器会记住，中途撤掉会让用户在缓存过期前
    # 一直只能走 https
    add_header Strict-Transport-Security "max-age=31536000" always;

    root  /opt/rn-foundation/admin/any123;
    index index.html;

    access_log /var/log/nginx/rn-foundation.console.access.log;
    error_log  /var/log/nginx/rn-foundation.console.error.log;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/xhtml+xml image/svg+xml;

    add_header Referrer-Policy        "no-referrer"   always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-Frame-Options        "SAMEORIGIN"    always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # 带内容哈希的产物可以长缓存；index.html 不行，否则发版后用户停在旧壳子上
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

