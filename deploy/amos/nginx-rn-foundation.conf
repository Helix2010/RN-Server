# /etc/nginx/conf.d/rn-foundation.conf
#
# 注意后缀：nginx.conf 里是 `include /etc/nginx/conf.d/*.conf`，没有 .conf 的文件
# 根本不会被加载（本机现存的 `console.any123.top` 就是这样，一直没生效）。
#
# 只听 443。这台机器的入站没有 80，也没有 13080；应用在 127.0.0.1:13080，由
# BIND_ADDRESS 锁在回环上。
#
# **server 块按证书分组**，不是按用途。每个 zone 一张证书，各自独立续期：一个
# zone 的续期出问题不会牵连另外两个。证书路径指向软链接，setup-tls.sh 签好后改
# 指向，这个文件不用动。
#
#   /etc/nginx/ssl/rn-foundation         predict.kim + any123.top（TLS-ALPN-01，443）
#   /etc/nginx/ssl/rn-foundation-anyfun  anyfun.win（DNS-01，域名在 Cloudflare 代理
#                                        后面，ALPN 校验的握手到不了本机）
#
# 公共 location 抽到 rn-foundation-snippet-*.inc，免得五个 server 块各抄一份。
#
# 三个控制台是**同一份产物**（/opt/rn-foundation/admin/console），请求 API 走同源 /v1/，由
# snippet-console 里的 location 转给 rn-server（RN-Admin 设计 console-single-build-same-origin-2026-09-25）。

# 转发给 rn-server 时用的 Host。api.* 就是它自己；console.* 换成这个租户的 api.*——后端按 Host 认租户、
# 拼下载地址与新机器的安装命令，看到的必须与控制台跨域的时代一样是 api.*。
# **加租户要在这里加一行**，漏了的话那个控制台的 /v1/ 一律 500（snippet-console 里有判断）
map $host $rn_upstream_host {
    default             $host;
    console.any123.top  api.any123.top;
    console.predict.kim api.predict.kim;
    console.anyfun.win  api.anyfun.win;
}

# ---------- API：rn-foundation ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.any123.top api.predict.kim;

    ssl_certificate     /etc/nginx/ssl/rn-foundation/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/rn-foundation/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rn_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/rn-foundation.api.access.log;
    error_log  /var/log/nginx/rn-foundation.api.error.log;

    include /etc/nginx/conf.d/rn-foundation-snippet-api.inc;
}

# ---------- API：rn-foundation-anyfun ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.anyfun.win;

    ssl_certificate     /etc/nginx/ssl/rn-foundation-anyfun/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/rn-foundation-anyfun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rn_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/rn-foundation.api.access.log;
    error_log  /var/log/nginx/rn-foundation.api.error.log;

    include /etc/nginx/conf.d/rn-foundation-snippet-api.inc;
}

# ---------- 控制台：console.any123.top ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.any123.top;

    ssl_certificate     /etc/nginx/ssl/rn-foundation/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/rn-foundation/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rn_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/rn-foundation/admin/console;

    access_log /var/log/nginx/rn-foundation.console.access.log;
    error_log  /var/log/nginx/rn-foundation.console.error.log;

    include /etc/nginx/conf.d/rn-foundation-snippet-console.inc;
    # 本机另挂在这个域名下的页面（例如 /prototype-design/ 原型页），文件只在 amos 上、不进仓库。
    # 用 glob：没有匹配的文件时 nginx 不报错，新装的机器照样起得来
    include /etc/nginx/conf.d/console-any123-*.inc;
}

