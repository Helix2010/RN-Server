# ---------- 平台控制台：platform.anyfun.win ----------
# 不属于任何租户（RN-Server 设计 service-and-console-split-2026-09-27 §4.2）。anyfun 那张源站证书是
# *.anyfun.win，覆盖得到；公网入口还要网关按 SNI 放行这个域名
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name platform.anyfun.win;

    ssl_certificate     /etc/nginx/ssl/rn-foundation-anyfun/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/rn-foundation-anyfun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rn_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/rn-foundation/admin/platform;

    access_log /var/log/nginx/rn-foundation.platform.access.log;
    error_log  /var/log/nginx/rn-foundation.platform.error.log;

    include /etc/nginx/conf.d/rn-foundation-snippet-platform.inc;
}
