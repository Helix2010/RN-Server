# /etc/nginx/conf.d/rn-foundation.conf
#
# 注意后缀：nginx.conf 里是 `include /etc/nginx/conf.d/*.conf`，没有 .conf 的文件
# 根本不会被加载（amos 上现存的 `console.any123.top` 就是这样，一直没生效）。
#
# 这里只写 :80。证书交给 certbot --nginx 去装，它会就地补出 443 的 server 块、
# 加上证书路径、并把 :80 改成跳转。手写 443 再让 certbot 改容易两边打架。
#
# 两个租户四个域名，server_name 一一对应。**租户是按 Host 头认的**
# （tenant_domain 表），所以反代必须原样传 $host——写成 `Host 127.0.0.1:13080`
# 的话服务端一律回 TENANT_DOMAIN_NOT_FOUND。

# ---------- API ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.any123.top api.predict.kim;

    access_log /var/log/nginx/rn-foundation.api.access.log;
    error_log  /var/log/nginx/rn-foundation.api.error.log;

    # 安装包直传走这条路径，512MB 的 APK 不能被 nginx 默认的 1m 卡掉。
    # 0 = 不限制，上限由服务端的 ARTIFACT_MAX_SIZE_MB 管
    client_max_body_size 0;
    # 大文件边收边转发，不先落盘再转
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:13080;

        # 租户识别靠它，不能改写
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
    }
}

# ---------- 控制台（纯静态，每租户一份产物）----------
# 管理端把 API 地址编译进包里（VITE_API_BASE_URL），所以两个租户是两份 dist，
# 不是同一份配两个 server_name
server {
    listen 80;
    listen [::]:80;
    server_name console.any123.top;

    root  /opt/rn-foundation/admin/any123;
    index index.html;

    access_log /var/log/nginx/rn-foundation.console.access.log;
    error_log  /var/log/nginx/rn-foundation.console.error.log;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/xhtml+xml image/svg+xml;

    add_header Referrer-Policy        "no-referrer"   always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-Frame-Options        "SAMEORIGIN"    always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # 带内容哈希的产物可以长缓存；index.html 不行，否则发版后用户停在旧壳子上
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name console.predict.kim;

    root  /opt/rn-foundation/admin/predict-kim;
    index index.html;

    access_log /var/log/nginx/rn-foundation.console.access.log;
    error_log  /var/log/nginx/rn-foundation.console.error.log;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/xhtml+xml image/svg+xml;

    add_header Referrer-Policy        "no-referrer"   always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-Frame-Options        "SAMEORIGIN"    always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
