# /etc/nginx/conf.d/rn-foundation.conf
#
# 注意后缀：nginx.conf 里是 `include /etc/nginx/conf.d/*.conf`，没有 .conf 的文件
# 根本不会被加载（本机现存的 `console.any123.top` 就是这样，一直没生效）。
#
# 只听 443。不开 80——这台机器的入站就是 443，Let's Encrypt 因此走 TLS-ALPN-01
# 而不是 HTTP-01（见 setup-tls.sh）。
#
# 证书路径指向一个软链接目录：证书还没签下来时它指向自签占位证书，签好之后
# setup-tls.sh 把它改指 /etc/letsencrypt/live/rn-foundation。nginx 配置本身不动，
# 所以重跑 install.sh 不会把 TLS 退回去。
#
# 两个租户四个域名。**租户是按 Host 头认的**（tenant_domain 表），所以反代必须
# 原样传 $host——参考配置里那句 `proxy_set_header Host 127.0.0.1:13080` 用在这里
# 会让服务端一律回 TENANT_DOMAIN_NOT_FOUND。

# ---------- API ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.any123.top api.predict.kim;

    ssl_certificate     /etc/nginx/ssl/rn-foundation/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/rn-foundation/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rn_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/rn-foundation.api.access.log;
    error_log  /var/log/nginx/rn-foundation.api.error.log;

    # 安装包直传走这条路径，512MB 的 APK 不能被 nginx 默认的 1m 卡掉。
    # 0 = 不限制，上限由服务端的 ARTIFACT_MAX_SIZE_MB 管
    client_max_body_size 0;
    # 大文件边收边转发，不先落盘再转
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:13080;

        # 租户识别靠它，不能改写
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
    }
}

# ---------- 控制台（纯静态，每租户一份产物）----------
# 管理端把 API 地址编译进包里（VITE_API_BASE_URL），所以两个租户是两份 dist，
# 不是同一份配两个 server_name
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.any123.top;

    ssl_certificate     /etc/nginx/ssl/rn-foundation/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/rn-foundation/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rn_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root  /opt/rn-foundation/admin/any123;
    index index.html;

    access_log /var/log/nginx/rn-foundation.console.access.log;
    error_log  /var/log/nginx/rn-foundation.console.error.log;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/json
               application/javascript application/xml+rss application/xhtml+xml
               image/svg+xml;

    add_header Referrer-Policy        "no-referrer" always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-Frame-Options        "SAMEORIGIN"  always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # 带内容哈希的产物可以长缓存；index.html 不行，否则发版后用户停在旧壳子上
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

