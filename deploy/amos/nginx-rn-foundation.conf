# /etc/nginx/conf.d/rn-foundation.conf
#
# 注意后缀：nginx.conf 里是 `include /etc/nginx/conf.d/*.conf`，没有 .conf 的文件
# 根本不会被加载（本机现存的 `console.any123.top` 就是这样，一直没生效）。
#
# 只听 443。这台机器的入站没有 80，也没有 13080–13082；应用的三个进程都在回环上，由
# BIND_ADDRESS 锁住。
#
# **server 块按证书分组**，不是按用途。每个 zone 一张证书，各自独立续期：一个
# zone 的续期出问题不会牵连另外两个。证书路径指向软链接，setup-tls.sh 签好后改
# 指向，这个文件不用动。
#
#   /etc/nginx/ssl/rn-foundation         predict.kim + any123.top（TLS-ALPN-01，443）
#   /etc/nginx/ssl/rn-foundation-anyfun  anyfun.win（DNS-01，域名在 Cloudflare 代理
#                                        后面，ALPN 校验的握手到不了本机）
#
# 公共 location 抽到 rn-foundation-snippet-*.inc，免得五个 server 块各抄一份。
#
# 三个租户控制台是**同一份产物**（/opt/rn-foundation/admin/console），请求 API 走同源 /v1/，由
# snippet-console 里的 location 转给 rn-server（RN-Admin 设计 console-single-build-same-origin-2026-09-25）。
# 平台控制台（platform.anyfun.win）是另一份产物（/opt/rn-foundation/admin/platform），见 snippet-platform。

# rn-server 按角色拆成三个进程（RN-Server 设计 service-and-console-split-2026-09-27 §3.4）。
# 每个转发的 location 先 set $rn_service 选一个，再 include snippet-api-proxy（proxy_pass http://$rn_service）。
# 变量的值与这里的 upstream 名字对得上，nginx 就直接用 upstream，不需要 resolver
upstream rn_app      { server 127.0.0.1:13081; }   # /v1/mobile、/v1/public、/v1/ota、/app、/.well-known
upstream rn_tenant   { server 127.0.0.1:13082; }   # 租户控制台的 /v1/admin 与统一登录
upstream rn_platform { server 127.0.0.1:13080; }   # /v1/admin/platform、打包机、签名闸

# 转发给 rn-server 时用的 Host。api.* 就是它自己；console.* 换成这个租户的 api.*——后端按 Host 认租户、
# 拼下载地址与新机器的安装命令，看到的必须与控制台跨域的时代一样是 api.*。
# **加租户要在这里加一行**，漏了的话那个控制台的 /v1/ 一律 500（snippet-console 里有判断）
map $host $rn_upstream_host {
    default             $host;
    console.any123.top  api.any123.top;
    console.predict.kim api.predict.kim;
    console.anyfun.win  api.anyfun.win;
}

# 浏览器地址栏里的控制台域名，转给 rn-server 的 X-RN-Console-Host 头。
# 统一登录要拿它拼回调地址 https://console.<租户域名>/client/v1/oauth/login——上面把 Host 改写成了 api.*，
# 后端从 Host 看不出控制台域名。api.* 上它是空串，proxy_set_header 给空值等于不发这个头，
# 客户端自己塞的同名头也就传不过去（后端还会核对它与 Host 属于同一个租户）。
map $host $rn_console_host {
    default      "";
    ~^console\. $host;
}

# 控制台上统一账号口令登录接口（/auth/v1/login，转给认证中心）的限流，用在 snippet-console。
# amos 看不到真实客户端 IP：公网入口是网关按 SNI 转发的 TCP，access log 里所有请求同一个来源，
# 所以按 $binary_remote_addr 实际就是全局限额——每分钟 60 次、突发 20（设计 platform-accounts-and-console-login §3.8）。
# 以后入口能带上真实 IP，这一行不用改就变成按 IP
limit_req_zone $binary_remote_addr zone=rn_cid_login:10m rate=60r/m;

# ---------- API：rn-foundation ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.any123.top api.predict.kim;

    ssl_certificate     /etc/nginx/ssl/rn-foundation/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/rn-foundation/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rn_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/rn-foundation.api.access.log;
    error_log  /var/log/nginx/rn-foundation.api.error.log;

    include /etc/nginx/conf.d/rn-foundation-snippet-api.inc;
}

